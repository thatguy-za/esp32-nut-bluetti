name: Pages (web installer)

on:
  release:
    types: [published, edited]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dist/index.html', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$tag" ]; then
            echo "No release yet — nothing to publish."
            exit 0
          fi
          echo "Latest release: $tag"
          mkdir -p _site
          cp dist/index.html _site/
          # Release assets carry the version in their name; the manifest
          # references a stable filename, so normalise it here.
          gh release download "$tag" -p '*-factory.bin' -D _site
          mv _site/*-factory.bin _site/esp32-nut-bluetti-factory.bin
          cat > _site/manifest.json <<EOF
          {
            "name": "esp32-nut-bluetti",
            "version": "${tag#v}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "esp32-nut-bluetti-factory.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF
          ls -l _site

      - name: Skip when there is no release
        id: check
        run: |
          if [ -d _site ] && [ -f _site/manifest.json ]; then
            echo "have_site=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_site=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.have_site == 'true'
        with:
          path: _site

      - id: deploy
        if: steps.check.outputs.have_site == 'true'
        uses: actions/deploy-pages@v4
