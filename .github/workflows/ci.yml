name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: host logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C test suites
        run: make -C test

  firmware-build:
    name: ESP-IDF build (esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tags, so esp_app_desc.version = git describe
      - name: idf.py build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
      - name: firmware size
        run: |
          test -f build/esp32-nut-bluetti.bin
          ls -l build/esp32-nut-bluetti.bin
