<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLUETTI NUT Bridge</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 1rem;
         min-height: 100vh; display: grid; place-items: center; }
  .card { width: 100%; max-width: 20rem; border: 1px solid #8884;
          border-radius: .6rem; padding: 1.2rem 1.3rem 1.4rem; }
  h1 { font-size: 1.05rem; margin: 0 0 .2rem; }
  .sub { font-size: .85rem; opacity: .65; margin: 0 0 1rem; }
  label { display: block; margin: .8rem 0 .2rem; font-size: .85rem; opacity: .8; }
  input { width: 100%; padding: .45rem .55rem; font: inherit;
          border: 1px solid #8886; border-radius: .35rem;
          background: Canvas; color: CanvasText; }
  button { width: 100%; margin-top: 1.1rem; padding: .5rem .8rem; font: inherit;
           border-radius: .35rem; border: 1px solid #2563eb;
           background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .msg { font-size: .85rem; margin: .9rem 0 0; min-height: 1.2em; }
  .err { color: #dc2626; }
  .hint { font-size: .78rem; opacity: .6; margin: 1.1rem 0 0; }
</style>
</head>
<body>
<form class="card" id="f">
  <h1>BLUETTI NUT Bridge</h1>
  <p class="sub" id="host">Sign in to continue.</p>

  <label for="u">Username</label>
  <input id="u" name="user" autocomplete="username" autocapitalize="none"
         autocorrect="off" spellcheck="false" required autofocus>

  <label for="p">Password</label>
  <input id="p" name="pass" type="password" autocomplete="current-password" required>

  <button id="go">Sign in</button>
  <p class="msg" id="msg"></p>
  <p class="hint">This is plain HTTP on your local network — there is no TLS,
    so treat it as keeping people out of the settings rather than as a secret.
    Forgotten the password? Hold BOOT through a reset to wipe the config.</p>
</form>

<script>
const $ = s => document.querySelector(s);
fetch('/api/hostname').then(r => r.text()).then(h => {
  if (h) { document.title = h; $('#host').textContent = 'Sign in to ' + h + '.'; }
}).catch(() => {});

$('#f').onsubmit = async (e) => {
  e.preventDefault();
  $('#go').disabled = true;
  $('#msg').className = 'msg';
  $('#msg').textContent = 'Signing in…';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      body: new URLSearchParams({ user: $('#u').value, pass: $('#p').value }),
    });
    if (r.ok) {
      /* Replace rather than assign, so Back does not land on this form
         again after signing in. */
      location.replace('/');
      return;
    }
    $('#msg').className = 'msg err';
    $('#msg').textContent = r.status === 401
      ? 'Wrong username or password.'
      : ((await r.text()).trim() || 'Sign-in failed.');
  } catch (err) {
    $('#msg').className = 'msg err';
    $('#msg').textContent = 'Could not reach the bridge: ' + err.message;
  }
  $('#go').disabled = false;
  $('#p').select();
};
</script>
</body>
</html>
